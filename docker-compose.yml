version: "3.9"
# Run: docker-compose up --build
# App: http://localhost:8080
services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - linguaforge-data:/data
    restart: unless-stopped
    environment:
      - LINGUAFORGE_DB=/data/linguaforge.db

volumes:
  linguaforge-data:
